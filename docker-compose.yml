version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nest_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nest_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
